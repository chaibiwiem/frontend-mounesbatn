      M 0 44
      C -34 18, -52 0, -52 -20
      C -52 -37, -39 -48, -25 -48
      C -14 -48, -5 -42, 0 -34
      C 5 -42, 14 -48, 25 -48
      C 39 -48, 52 -37, 52 -20
      C 52 0, 34 18, 0 44
      Z
      M -2 34
      C -26 14, -38 1, -38 -14
      C -38 -26, -29 -34, -19 -34
      C -11 -34, -4 -29, 0 -23
      C 4 -29, 11 -34, 19 -34
      C 29 -34, 38 -26, 38 -14
      C 38 1, 26 14, 2 34
      Z" />

    <!-- coeur interieur rose -->
    <path fill="#FF99BE" d="
      M 4 30
      C -16 12, -26 1, -26 -11
      C -26 -21, -19 -28, -11 -28
      C -5 -28, 0 -24, 4 -19
      C 8 -24, 13 -28, 19 -28
      C 27 -28, 34 -21, 34 -11
      C 34 1, 24 12, 4 30
      Z" />
