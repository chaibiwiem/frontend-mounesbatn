<svg xmlns="http://www.w3.org/2000/svg" width="470" height="120" viewBox="0 0 470 120" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Mounesba — logo horizontal</title>
  <desc>Logo Mounesba : coeur bleu contenant un coeur rose imbrique, nom en Playfair Display.</desc>

  <g transform="translate(70,60)">
